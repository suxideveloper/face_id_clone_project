{% extends "base.html" %}

{% block navbar %}
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <canvas id="gridCanvas"></canvas>

    <!-- Floating decorative orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card">
        <!-- Glow accent -->
        <div class="card-glow"></div>

        <div class="login-header">
            <img src="../static/images/airi-logo_uz.png" alt="Logo" class="login-logo">
            <h1>Xodimlarni nazorat qilish tizimi</h1>
            <p>Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
        </div>

        <form action="/login?next={{ next }}" method="POST" class="login-form">
            <div class="input-group">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <input type="text" id="username" name="username" placeholder="Loginni kiriting" required
                    autocomplete="off">
            </div>

            <div class="input-group">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="password" name="password" placeholder="Parolni kiriting" required>
                <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            {% if error %}
            <div class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <button type="submit" class="btn-login" id="loginBtn">
                <span>Kirish</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="login-footer">
            <div class="security-note">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>Xavfsiz ulanish orqali himoyalangan</span>
            </div>
        </div>
    </div>
</div>

<style>
    .container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* ========== CANVAS ========== */
    #gridCanvas {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
    }

    /* ========== FLOATING ORBS ========== */
    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.3;
        z-index: 0;
        animation: floatOrb 15s ease-in-out infinite;
    }

    .orb-1 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #667eea, transparent);
        top: -100px;
        right: -100px;
        animation-delay: 0s;
    }

    .orb-2 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, #0ea5e9, transparent);
        bottom: -80px;
        left: -80px;
        animation-delay: -5s;
    }

    .orb-3 {
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, #a78bfa, transparent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: -10s;
    }

    @keyframes floatOrb {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(30px, -40px) scale(1.05); }
        50% { transform: translate(-20px, 20px) scale(0.95); }
        75% { transform: translate(15px, 30px) scale(1.02); }
    }

    /* ========== WRAPPER ========== */
    .login-wrapper {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 20px;
    }

    /* ========== CARD ========== */
    .login-card {
        position: relative;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        padding: 48px 44px 40px;
        border-radius: 28px;
        width: 100%;
        max-width: 460px;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow:
            0 8px 32px rgba(0, 0, 0, 0.25),
            0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        overflow: hidden;
    }

    .card-glow {
        position: absolute;
        top: -2px;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 4px;
        background: linear-gradient(90deg, transparent, #667eea, #0ea5e9, transparent);
        border-radius: 0 0 4px 4px;
        opacity: 0.8;
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* ========== HEADER ========== */
    .login-header {
        text-align: center;
        margin-bottom: 36px;
    }

    .login-logo {
        width: 280px;
        height: auto;
        margin-bottom: 20px;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.15));
    }

    .login-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #ffffff;
        margin: 0 0 8px 0;
        letter-spacing: -0.3px;
        line-height: 1.3;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .login-header p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
        margin: 0;
        line-height: 1.5;
    }

    /* ========== INPUTS ========== */
    .input-group {
        position: relative;
        margin-bottom: 18px;
    }

    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        pointer-events: none;
        transition: color 0.3s;
        z-index: 2;
    }

    .input-group input {
        width: 100%;
        padding: 15px 48px 15px 48px;
        background: rgba(255, 255, 255, 0.07);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        font-size: 0.95rem;
        color: #ffffff;
        outline: none;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }

    .input-group input:focus {
        border-color: rgba(102, 126, 234, 0.6);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    .input-group:focus-within .input-icon {
        color: #667eea;
    }

    .toggle-password {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        transition: color 0.2s;
        z-index: 2;
    }

    .toggle-password:hover {
        color: rgba(255, 255, 255, 0.7);
    }

    /* ========== ERROR ========== */
    .error-message {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 18px;
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid rgba(239, 68, 68, 0.25);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    /* ========== BUTTON ========== */
    .btn-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #5a67d8 50%, #764ba2 100%);
        background-size: 200% 200%;
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }

    .btn-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        transition: left 0.5s;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        background-position: right center;
    }

    .btn-login:hover::before {
        left: 100%;
    }

    .btn-login:active {
        transform: translateY(0);
    }

    /* ========== FOOTER ========== */
    .login-footer {
        margin-top: 28px;
        text-align: center;
    }

    .security-note {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.8rem;
        font-weight: 500;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
        .login-card {
            padding: 36px 24px 32px;
            border-radius: 20px;
        }

        .login-logo {
            width: 220px;
        }

        .login-header h1 {
            font-size: 1.3rem;
        }

        .orb { display: none; }
    }
</style>

<script>
    // Toggle password visibility
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            pwd.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    // Canvas animation
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const config = {
        gridSize: 50,
        particleCount: 40,
        particleSpeedMin: 0.3,
        particleSpeedMax: 3,
        particleColors: ['rgba(102,126,234,0.7)', 'rgba(14,165,233,0.6)', 'rgba(167,139,250,0.5)', 'rgba(255,255,255,0.4)'],
        trailLength: 25,
        backgroundColor: '#1a2332',
        rippleDuration: 2000,
        rippleMaxRadius: 200
    };

    const occupiedLines = { horizontal: new Set(), vertical: new Set() };

    function createGrid() {
        // Gradient background
        const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        bg.addColorStop(0, '#1a2332');
        bg.addColorStop(0.5, '#1e2d42');
        bg.addColorStop(1, '#1a2332');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle grid
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = 'rgba(102, 126, 234, 0.06)';

        for (let y = 0; y < canvas.height; y += config.gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
        for (let x = 0; x < canvas.width; x += config.gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        // Grid intersection dots
        ctx.fillStyle = 'rgba(102, 126, 234, 0.08)';
        for (let y = 0; y < canvas.height; y += config.gridSize) {
            for (let x = 0; x < canvas.width; x += config.gridSize) {
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    class Particle {
        constructor() {
            this.active = false;
            this.trail = [];
            this.reset();
        }

        update() {
            if (!this.active) return;
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > config.trailLength) this.trail.shift();

            if (this.direction === 'horizontal') {
                this.x += this.speed;
                if (this.x > canvas.width) this.retire();
            } else {
                this.y += this.speed;
                if (this.y > canvas.height) this.retire();
            }
        }

        retire() {
            this.active = false;
            if (this.direction === 'horizontal') occupiedLines.horizontal.delete(this.rowOrCol);
            else occupiedLines.vertical.delete(this.rowOrCol);
            setTimeout(() => this.reset(), Math.random() * 2000 + 500);
        }

        draw() {
            if (!this.active || this.trail.length < 2) return;

            // Glowing trail
            for (let i = 0; i < this.trail.length; i++) {
                const point = this.trail[i];
                const progress = i / this.trail.length;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = progress * 0.8;
                ctx.beginPath();
                ctx.arc(point.x, point.y, 1 + progress, 0, Math.PI * 2);
                ctx.fill();
            }

            // Head glow
            const head = this.trail[this.trail.length - 1];
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(head.x, head.y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1.0;
        }

        findAvailableLine() {
            if (Math.random() > 0.5) {
                const y = Math.floor(Math.random() * (canvas.height / config.gridSize)) * config.gridSize;
                if (!occupiedLines.horizontal.has(y)) {
                    this.direction = 'horizontal';
                    this.x = 0;
                    this.y = y;
                    this.rowOrCol = y;
                    occupiedLines.horizontal.add(y);
                    return true;
                }
            } else {
                const x = Math.floor(Math.random() * (canvas.width / config.gridSize)) * config.gridSize;
                if (!occupiedLines.vertical.has(x)) {
                    this.direction = 'vertical';
                    this.x = x;
                    this.y = 0;
                    this.rowOrCol = x;
                    occupiedLines.vertical.add(x);
                    return true;
                }
            }
            return false;
        }

        reset() {
            this.trail = [];
            this.color = config.particleColors[Math.floor(Math.random() * config.particleColors.length)];
            this.speed = Math.random() * (config.particleSpeedMax - config.particleSpeedMin) + config.particleSpeedMin;
            if (this.findAvailableLine()) {
                this.active = true;
            } else {
                setTimeout(() => this.reset(), 200);
            }
        }
    }

    const particles = Array(config.particleCount).fill().map(() => new Particle());

    let ripples = [];
    class Ripple {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.radius = 0;
            this.maxRadius = config.rippleMaxRadius;
            this.startTime = Date.now();
        }
        update() {
            this.radius = ((Date.now() - this.startTime) / config.rippleDuration) * this.maxRadius;
        }
        draw() {
            const alpha = Math.max(0, 1 - (this.radius / this.maxRadius)) * 0.5;
            ctx.strokeStyle = `rgba(102, 126, 234, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
        }
        isComplete() { return this.radius >= this.maxRadius; }
    }

    function animate() {
        createGrid();
        particles.forEach(p => { p.update(); p.draw(); });
        ripples = ripples.filter(r => !r.isComplete());
        ripples.forEach(r => { r.update(); r.draw(); });
        requestAnimationFrame(animate);
    }

    document.addEventListener('click', (e) => {
        ripples.push(new Ripple(e.clientX, e.clientY));
    });

    animate();

    // Button loading state on submit
    document.querySelector('.login-form').addEventListener('submit', function() {
        const btn = document.getElementById('loginBtn');
        // Delay visual change so form submission isn't blocked
        setTimeout(() => {
            btn.innerHTML = '<span>Kirish...</span><svg class="spin" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>';
            btn.disabled = true;
        }, 50);
    });

    // Reset button if user navigates back
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span>Kirish</span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
            btn.disabled = false;
        }
    });
</script>

<style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }
</style>
{% endblock %}
