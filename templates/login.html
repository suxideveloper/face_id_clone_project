{% extends "base.html" %}

{% block navbar %}
<!-- No Navbar for Login -->
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="brand-logo">FacePass Admin</div>
        <h2>Sign In</h2>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
</div>

<style>
    .login-page {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7f6;
    }

    .login-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .brand-logo {
        font-size: 1.5rem;
        font-weight: 800;
        color: #0288d1;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    h2 {
        margin-bottom: 30px;
        color: #333;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #666;
        font-weight: 600;
        font-size: 0.9rem;
    }

    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
        /* Fix padding issue */
    }

    .form-group input:focus {
        outline: none;
        border-color: #0288d1;
        box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.1);
    }

    .btn-login {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #0288d1, #26c6da);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.2s;
    }

    .btn-login:hover {
        transform: translateY(-2px);
    }

    .error-message {
        background: #ffebee;
        color: #c62828;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 0.9rem;
    }
</style>
{% endblock %}
