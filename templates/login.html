{% extends "base.html" %}

{% block navbar %}
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-background-shape"></div>
    <div class="login-card">
        <div class="login-header">
            <img src="../static/images/airi-logo_uz.png" alt="Logo" class="login-logo">
            <h1>Xodimlarni nazorat qilish tizimi</h1>
            <p>Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
        </div>

        <form action="/login" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Foydalanuvchi nomi</label>
                <input type="text" id="username" name="username" placeholder="Loginni kiriting" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Parol</label>
                <input type="password" id="password" name="password" placeholder="Parolni kiriting" required>
            </div>

            {% if error %}
            <div class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <button type="submit" class="btn-login">
                Kirish
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </button>

            <div class="footer-links">
                <a href="#">Parolni unutdingizmi?</a>
            </div>
        </form>
    </div>
</div>

<style>
    :root {
        --primary-color: #4F46E5;
        --primary-dark: #4338ca;
        --secondary-color: #0EA5E9;
        --bg-gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        --text-dark: #1e293b;
        --text-medium: #64748b;
        --radius-lg: 16px;
        --shadow-card: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .login-wrapper {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-gradient);
        position: relative;
        overflow: hidden;
        padding: 20px; /* Mobil qurilmalarda chetidan joy qolishi uchun */
    }

    .login-background-shape {
        position: absolute;
        width: 800px;
        height: 800px;
        background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        border-radius: 50%;
        opacity: 0.05;
        top: -200px;
        right: -100px;
        z-index: 0;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        padding: 40px; /* 48px dan 40px ga tushirildi, ixchamroq bo'lishi uchun */
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        width: 100%;
        max-width: 400px; /* 400px dan 380px ga - standart o'lcham */
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.6);
        animation: slideUp 0.6s ease-out forwards;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-logo {
        width: 100%;
        height: auto;
        margin-bottom: 16px;
        object-fit: contain;
    }

    /* --- MATN O'LCHAMLARI YANGILANDI --- */
    
    .login-header h1 {
        font-size: 1.5rem; /* 24px - Eng optimal sarlavha o'lchami */
        font-weight: 700;
        color: var(--text-dark);
        margin: 0 0 8px 0;
        letter-spacing: -0.5px;
        line-height: 1.2;
    }

    .login-header p {
        color: var(--text-medium);
        font-size: 0.95rem; /* 15px - Subtitle uchun */
        margin: 0;
        line-height: 1.5;
    }

    .login-form .form-group {
        margin-bottom: 20px;
        position: relative;
    }

    .login-form .form-group label {
        display: block;
        color: var(--text-dark);
        font-size: 0.875rem; /* 14px - Label inputdan kichik bo'lishi shart */
        font-weight: 600;
        margin-bottom: 8px;
    }

    .login-form .form-group input {
        width: 100%;
        padding: 12px 16px; /* Paddinglar ixchamlashtirildi */
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 1rem; /* 16px - Standart o'qish o'lchami */
        color: var(--text-dark);
        background-color: #f8fafc;
        transition: all 0.2s ease;
        outline: none;
    }

    .login-form .form-group input:focus {
        border-color: var(--primary-color);
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); /* Shadow sal nazokatliroq qilindi */
    }

    .btn-login {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem; /* Tugma matni ham 16px */
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-login:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 15px rgba(79, 70, 229, 0.25);
    }

    .error-message {
        background: #fef2f2;
        color: #ef4444;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 0.875rem; /* Xatolik matni kichikroq */
        font-weight: 500;
        border: 1px solid #fee2e2;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .footer-links {
        margin-top: 24px;
        text-align: center;
    }

    .footer-links a {
        color: var(--text-medium);
        font-size: 0.875rem; /* 14px */
        text-decoration: none;
        transition: color 0.2s;
    }

    .footer-links a:hover {
        color: var(--primary-color);
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 30px 20px;
        }
        .login-header h1 {
            font-size: 1.35rem; /* Mobilda sarlavha sal kichrayadi */
        }
    }
</style>
{% endblock %}
