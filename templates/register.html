{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Yangi xodimni ro'yxatdan o'tkazish</h1>
</div>

<div class="registration-grid">
    <!-- Step 1: Face Capture -->
    <div class="card capture-card">
        <div class="card-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="step-badge">Step 1</span>
                <h2>Rasmni yuklash</h2>
            </div>
        </div>
        <div class="card-body">
            <div class="video-wrapper">
                <img src="/video_feed?mode=registration" alt="Video Feed" id="videoFeed">
                <div class="pose-progress" id="poseProgress">
                    <div class="pose-step" data-step="1">①</div>
                    <div class="pose-step" data-step="2">②</div>
                    <div class="pose-step" data-step="3">③</div>
                    <div class="pose-step" data-step="4">④</div>
                    <div class="pose-step" data-step="5">⑤</div>
                </div>
            </div>

            <div class="pose-instructions" id="poseInstructions">
                Username (ID) ni kiriting va "Boshlash" tugmasini bosing
            </div>

            <div class="capture-controls">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="captureUsername">Username (ID)*</label>
                    <input type="text" id="captureUsername" placeholder="Username (ID)" required>
                </div>
                <button type="button" id="startCaptureBtn" class="btn btn-capture" onclick="startCapture()">
                    Boshlash
                </button>
            </div>

            <div id="captureStatus" class="status-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Step 2: Employee Details -->
    <div class="card form-card">
        <div class="card-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="step-badge step-pending" id="step2Badge">Step 2</span>
                <h2>Xodim ma'lumotlari</h2>
            </div>
        </div>
        <div class="card-body">
            <form id="registerForm">
                <input type="hidden" id="hiddenName" name="name" value="">

                <div class="form-group">
                    <label>Username (ID)</label>
                    <input type="text" id="displayUsername" disabled class="locked-input">
                    <small>Captured in Step 1</small>
                </div>

                <div class="form-group">
                    <label for="full_name">Ism Familiya</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Ism Familiya" disabled>
                </div>

                <div class="form-group">
                    <label for="phone">Telefon raqam</label>
                    <input type="tel" id="phone" name="phone" placeholder="Telefon raqam" disabled>
                </div>

                <div class="form-group">
                    <label for="department">Bo'lim</label>
                    <select id="department" name="department" disabled>
                        <option value="">Bo'limni tanlang</option>
                        <option value="rahbariyat">Rahbariyat</option>
                        <option value="buxgalteriya">Buxgalteriya</option>
                        <option value="HR">Xodimlar bilan ishlash bo'limi</option>
                        <option value="mutaxassislar">Mutaxassislar</option>
                        <option value="biometrik tizimlar labaratoriyasi">Biometrik tizimlar labaratoriyasi</option>
                        <option value="Intelektual dastury tizimlar qo'shma labaratoriyasi">Intelektual dastury tizimlar qo'shma
                            labaratoriyasi</option>
                        <option value="Timsollarni tanib olish labaratoriyasi">Timsollarni tanib olish labaratoriyasi</option>
                        <option value="tabiy tilni qayta ishlash labaratoriyasi">Tabiiy tilni qayta ishlash labaratoriyasi</option>
                        <option value="Murakkab tizimlarni modellashtirish labaratoriyasi">Murakkab tizimlarni modellashtirish
                            labaratoriyasi</option>
                        <option value="Sun'iy intelekt va mashinaviy o'qitish labaratoriyasi">Sun'iy intelekt va mashinaviy o'qitish
                            labaratoriyasi</option>
                        <option value="Aqilli tizimlar va buyumlar interneti labaratoriyasi">Aqilli tizimlar va buyumlar interneti
                            labaratoriyasi</option>
                        <option value="Texnik tizimlarni boshqarish va raqamli loyhalash labaratoriyasi">Texnik tizimlarni
                            boshqarish va raqamli loyhalash labaratoriyasi</option>
                        <option value="Dasturiy mahsulotlarni ishlab chiqsh bo'limi">Dasturiy mahsulotlarni ishlab chiqsh bo'limi</option>
                        <option value="Dasturiy mahsulotlarni sinovdan o'tkazish bo'limi">Dasturiy mahsulotlarni sinovdan o'tkazish
                            bo'limi</option>
                        <option value="Dasturiy mahsulotlarni joriy etish bo'limi">Dasturiy mahsulotlarni joriy etish bo'limi</option>
                        <option value="AKT startuplarni qo'llab quvvatlash bo'limi">AKT startuplarni qo'llab quvvatlash bo'limi</option>
                        <option value="Patentlash va tijoratlashtirish bo'limi">Patentlash va tijor atlashtirish bo'limi</option>
                        <option value="Umumiy bo'lim">Umumiy bo'lim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="position">Lavozim</label>
                    <input type="text" id="position" name="position" placeholder="Lavozim" disabled>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;" disabled>
                    Ro'yxatdan o'tish
                </button>
            </form>

            <div id="formStatus" class="status-message" style="display: none;"></div>
        </div>
    </div>
</div>

<div class="mt-6">
    <a href="/" class="back-link">← Back to Verification</a>
</div>

<style>
    .registration-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        align-items: start;
    }

    @media (max-width: 1000px) {
        .registration-grid {
            grid-template-columns: 1fr;
        }
    }

    .step-badge {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.85rem;
    }

    .step-badge.step-pending {
        background: var(--text-light);
    }

    .step-badge.step-complete {
        background: linear-gradient(135deg, var(--accent-green), #059669);
    }

    .video-wrapper {
        position: relative;
        background: #000;
        border-radius: var(--radius-md);
        overflow: hidden;
        aspect-ratio: 4/3;
    }

    .video-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .pose-progress {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 25px;
    }

    .pose-step {
        font-size: 1.2rem;
        color: #666;
        transition: all 0.3s ease;
    }

    .pose-step.active {
        color: var(--accent-orange);
        transform: scale(1.2);
        animation: pulse 1s infinite;
    }

    .pose-step.complete {
        color: var(--accent-green);
    }

    @keyframes pulse {

        0%,
        100% {
            transform: scale(1.2);
        }

        50% {
            transform: scale(1.4);
        }
    }

    .pose-instructions {
        text-align: center;
        padding: 14px;
        background: var(--bg-primary);
        border-radius: var(--radius-sm);
        margin: 16px 0;
        font-weight: 500;
        color: var(--text-medium);
    }

    .capture-controls {
        display: flex;
        gap: 16px;
        align-items: flex-end;
    }

    .btn-capture {
        background: linear-gradient(135deg, var(--accent-orange), #d97706);
        color: white;
        white-space: nowrap;
        padding: 12px 24px;
    }

    .btn-capture:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(249, 158, 11, 0.4);
    }

    .btn-capture:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .locked-input {
        background: #dcfce7 !important;
        color: var(--accent-green) !important;
        font-weight: 500;
    }
</style>

<script>
    let capturedUsername = null;
    let pollInterval = null;

    function updatePoseProgress(stage) {
        const steps = document.querySelectorAll('.pose-step');
        const instructions = document.getElementById('poseInstructions');

        const poseInstructions = [
            "📷 Look straight at the camera",
            "⬅️ Turn your head slightly LEFT",
            "➡️ Turn your head slightly RIGHT",
            "⬆️ Tilt your chin UP slightly",
            "⬇️ Tilt your chin DOWN slightly"
        ];

        steps.forEach((step, idx) => {
            step.classList.remove('active', 'complete');
            if (idx < stage) {
                step.classList.add('complete');
            } else if (idx === stage) {
                step.classList.add('active');
            }
        });

        if (stage >= 0 && stage < 5) {
            instructions.textContent = poseInstructions[stage];
            instructions.style.background = '#fef3c7';
            instructions.style.color = '#b45309';
        } else if (stage >= 5) {
            instructions.textContent = "✅ All poses captured! Processing...";
            instructions.style.background = '#dcfce7';
            instructions.style.color = '#166534';
        }
    }

    async function pollRegistrationState() {
        try {
            const response = await fetch('/api/registration-state');
            const data = await response.json();
            if (data.stage >= 0) {
                updatePoseProgress(data.stage);
            }
        } catch (e) { }
    }

    async function startCapture() {
        const usernameInput = document.getElementById('captureUsername');
        const username = usernameInput.value.trim();

        if (!username) {
            alert('Please enter a username first!');
            usernameInput.focus();
            return;
        }

        const btn = document.getElementById('startCaptureBtn');
        const statusDiv = document.getElementById('captureStatus');
        const instructions = document.getElementById('poseInstructions');

        btn.disabled = true;
        btn.textContent = '📸 Capturing...';
        usernameInput.disabled = true;

        statusDiv.textContent = "📸 Starting capture... Follow the pose instructions!";
        statusDiv.className = "status-message loading";
        statusDiv.style.display = "block";

        document.querySelectorAll('.pose-step').forEach(s => s.classList.remove('active', 'complete'));

        pollInterval = setInterval(pollRegistrationState, 300);

        try {
            const formData = new FormData();
            formData.append('name', username);

            const response = await fetch('/api/capture-faces', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            clearInterval(pollInterval);

            if (result.success) {
                capturedUsername = username;
                statusDiv.textContent = "✅ " + result.message;
                statusDiv.className = "status-message success";

                document.querySelectorAll('.pose-step').forEach(s => {
                    s.classList.remove('active');
                    s.classList.add('complete');
                });

                instructions.textContent = "✅ Face capture complete! Fill in the details.";
                instructions.style.background = '#dcfce7';
                instructions.style.color = '#166534';

                enableFormSection(username);
            } else {
                statusDiv.textContent = "❌ " + result.message;
                statusDiv.className = "status-message error";
                btn.disabled = false;
                btn.textContent = '📸 Start Capture';
                usernameInput.disabled = false;

                instructions.textContent = "Position your face in the frame and try again";
                instructions.style.background = 'var(--bg-primary)';
                instructions.style.color = 'var(--text-medium)';
            }
        } catch (err) {
            clearInterval(pollInterval);
            statusDiv.textContent = "❌ Network Error: " + err;
            statusDiv.className = "status-message error";
            btn.disabled = false;
            btn.textContent = '📸 Start Capture';
            usernameInput.disabled = false;
        }
    }

    function enableFormSection(username) {
        document.getElementById('step2Badge').classList.remove('step-pending');
        document.getElementById('step2Badge').classList.add('step-complete');

        document.getElementById('hiddenName').value = username;
        document.getElementById('displayUsername').value = username;

        document.getElementById('full_name').disabled = false;
        document.getElementById('phone').disabled = false;
        document.getElementById('department').disabled = false;
        document.getElementById('position').disabled = false;
        document.getElementById('submitBtn').disabled = false;

        document.getElementById('full_name').focus();
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('formStatus');
        const btn = document.getElementById('submitBtn');

        btn.disabled = true;
        btn.textContent = 'Registering...';
        statusDiv.textContent = "Processing registration...";
        statusDiv.className = "status-message loading";
        statusDiv.style.display = "block";

        try {
            const response = await fetch('/api/complete-registration', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.success) {
                statusDiv.textContent = "✅ " + result.message;
                statusDiv.className = "status-message success";
                setTimeout(() => window.location.href = '/users', 2000);
            } else {
                statusDiv.textContent = "❌ " + result.message;
                statusDiv.className = "status-message error";
                btn.disabled = false;
                btn.textContent = 'Complete Registration';
            }
        } catch (err) {
            statusDiv.textContent = "❌ Network Error: " + err;
            statusDiv.className = "status-message error";
            btn.disabled = false;
            btn.textContent = 'Complete Registration';
        }
    });
</script>
{% endblock %}
