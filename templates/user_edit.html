{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>✏️ Tahrirlash</h1>
</div>

<div class="edit-container">
    <div class="card">
        <div class="card-body">
            <form id="editForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" value="{{ name }}" disabled class="locked-input">
                    <small>User ID o'zgartirilmaydi</small>
                </div>

                <div class="form-group">
                    <label for="full_name">To'liq Ismi va Familiyasi</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user_info.full_name or '' }}"
                        placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="phone">Teleforn raqami</label>
                    <input type="tel" id="phone" name="phone" value="{{ user_info.phone or '' }}"
                        placeholder="e.g., +998 90 123 45 67">
                </div>

                <div class="form-group">
                    <label for="department">Bo'lim</label>
                    <select id="department" name="department">
                        <option value="">Bo'limni tanlang</option>
                        <option value="rahbariyat" {% if user_info.department=="rahbariyat" %}selected{% endif %}>
                            Rahbariyat</option>
                        <option value="buxgalteriya" {% if user_info.department=="buxgalteriya" %}selected{% endif %}>
                            Buxgalteriya</option>
                        <option value="HR" {% if user_info.department=="HR" %}selected{% endif %}>Xodimlar bilan ishlash
                            bo'limi</option>
                        <option value="mutaxassislar" {% if user_info.department=="mutaxassislar" %}selected{% endif %}>
                            Mutaxassislar</option>
                        <option value="biometrik tizimlar labaratoriyasi" {% if
                            user_info.department=="biometrik tizimlar labaratoriyasi" %}selected{% endif %}>Biometrik
                            tizimlar labaratoriyasi</option>
                        <option value="Intelektual dastury tizimlar qo'shma labaratoriyasi" {% if
                            user_info.department=="Intelektual dastury tizimlar qo'shma labaratoriyasi" %}selected{%
                            endif %}>Intelektual dastury tizimlar qo'shma labaratoriyasi</option>
                        <option value="Timsollarni tanib olish labaratoriyasi" {% if
                            user_info.department=="Timsollarni tanib olish labaratoriyasi" %}selected{% endif %}>
                            Timsollarni tanib olish labaratoriyasi</option>
                        <option value="tabiy tilni qayta ishlash labaratoriyasi" {% if
                            user_info.department=="tabiy tilni qayta ishlash labaratoriyasi" %}selected{% endif %}>
                            Tabiiy tilni qayta ishlash labaratoriyasi</option>
                        <option value="Murakkab tizimlarni modellashtirish labaratoriyasi" {% if
                            user_info.department=="Murakkab tizimlarni modellashtirish labaratoriyasi" %}selected{%
                            endif %}>Murakkab tizimlarni modellashtirish labaratoriyasi</option>
                        <option value="Sun'iy intelekt va mashinaviy o'qitish labaratoriyasi" {% if
                            user_info.department=="Sun'iy intelekt va mashinaviy o'qitish labaratoriyasi" %}selected{%
                            endif %}>Sun'iy intelekt va mashinaviy o'qitish labaratoriyasi</option>
                        <option value="Aqilli tizimlar va buyumlar interneti labaratoriyasi" {% if
                            user_info.department=="Aqilli tizimlar va buyumlar interneti labaratoriyasi" %}selected{%
                            endif %}>Aqilli tizimlar va buyumlar interneti labaratoriyasi</option>
                        <option value="Texnik tizimlarni boshqarish va raqamli loyhalash labaratoriyasi" {% if
                            user_info.department=="Texnik tizimlarni boshqarish va raqamli loyhalash labaratoriyasi"
                            %}selected{% endif %}>Texnik tizimlarni boshqarish va raqamli loyhalash labaratoriyasi
                        </option>
                        <option value="Dasturiy mahsulotlarni ishlab chiqsh bo'limi" {% if
                            user_info.department=="Dasturiy mahsulotlarni ishlab chiqsh bo'limi" %}selected{% endif %}>
                            Dasturiy mahsulotlarni ishlab chiqsh bo'limi</option>
                        <option value="Dasturiy mahsulotlarni sinovdan o'tkazish bo'limi" {% if
                            user_info.department=="Dasturiy mahsulotlarni sinovdan o'tkazish bo'limi" %}selected{% endif
                            %}>Dasturiy mahsulotlarni sinovdan o'tkazish bo'limi</option>
                        <option value="Dasturiy mahsulotlarni joriy etish bo'limi" {% if
                            user_info.department=="Dasturiy mahsulotlarni joriy etish bo'limi" %}selected{% endif %}>
                            Dasturiy mahsulotlarni joriy etish bo'limi</option>
                        <option value="AKT startuplarni qo'llab quvvatlash bo'limi" {% if
                            user_info.department=="AKT startuplarni qo'llab quvvatlash bo'limi" %}selected{% endif %}>
                            AKT startuplarni qo'llab quvvatlash bo'limi</option>
                        <option value="Patentlash va tijoratlashtirish bo'limi" {% if
                            user_info.department=="Patentlash va tijoratlashtirish bo'limi" %}selected{% endif %}>
                            Patentlash va tijoratlashtirish bo'limi</option>
                        <option value="Umumiy bo'lim" {% if user_info.department=="Umumiy bo'lim" %}selected{% endif %}>
                            Umumiy bo'lim</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="position">Lavozimi</label>
                    <input type="text" id="position" name="position" value="{{ user_info.position or '' }}"
                        placeholder="e.g., Software Engineer">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 O'zgarishlarni saqlash</button>
                    <a href="/users/{{ name }}" class="btn btn-secondary">Bekor qilish</a>
                </div>
            </form>

            <div id="status" class="status-message" style="display: none;"></div>
        </div>
    </div>
</div>

<div class="mt-6">
    <a href="/users" class="back-link">← Back to Employees</a>
</div>

<style>
    .edit-container {
        max-width: 560px;
        margin: 0 auto;
    }

    .form-actions {
        display: flex;
        gap: 16px;
        margin-top: 28px;
    }

    .locked-input {
        background: var(--bg-primary) !important;
        color: var(--text-light) !important;
        cursor: not-allowed;
    }
</style>

<script>
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('status');
        const btn = document.querySelector('.btn-primary');

        btn.textContent = 'Saving...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/users/{{ name }}/update', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            statusDiv.style.display = 'block';

            if (response.ok) {
                statusDiv.textContent = "✅ " + result.message;
                statusDiv.className = "status-message success";
                setTimeout(() => window.location.href = '/users/{{ name }}', 1500);
            } else {
                statusDiv.textContent = "❌ Error: " + result.message;
                statusDiv.className = "status-message error";
            }
        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = "❌ Network Error: " + err;
            statusDiv.className = "status-message error";
        }

        btn.textContent = '💾 Save Changes';
        btn.disabled = false;
    });
</script>
{% endblock %}
