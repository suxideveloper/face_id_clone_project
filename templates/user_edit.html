{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>✏️ Tahrirlash</h1>
</div>

<div class="edit-container">
    <div class="card">
        <div class="card-body">
            <form id="editForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" value="{{ name }}" disabled class="locked-input">
                    <small>User ID o'zgartirilmaydi</small>
                </div>

                <div class="form-group">
                    <label for="full_name">To'liq Ismi va Familiyasi</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user_info.full_name or '' }}"
                        placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label for="phone">Teleforn raqami</label>
                    <input type="tel" id="phone" name="phone" value="{{ user_info.phone or '' }}"
                        placeholder="e.g., +998 90 123 45 67">
                </div>

                <div class="form-group">
                    <label for="department">Bo'lim</label>
                    <select id="department" name="department">
                        <option value="">Bo'limni tanlang</option>
                        {% for dept in departments %}
                        <option value="{{ dept.name }}" {% if user_info.department == dept.name %}selected{% endif %}>
                            {{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="position">Lavozimi</label>
                    <input type="text" id="position" name="position" value="{{ user_info.position or '' }}"
                        placeholder="e.g., Software Engineer">
                </div>

                <div class="form-group">
                    <label for="person_type">Kategoriya</label>
                    {% set ptype = user_info.person_type or 'staff' %}
                    <select id="person_type" name="person_type">
                        <option value="staff"      {% if ptype == 'staff' %}selected{% endif %}>👤 Asosiy xodim</option>
                        <option value="doctorant"  {% if ptype == 'doctorant' %}selected{% endif %}>🎓 Doktorant (20 soat/hafta)</option>
                        <option value="visitor"    {% if ptype == 'visitor' %}selected{% endif %}>👥 Tashrif buyuruvchi</option>
                        <option value="consultant" {% if ptype == 'consultant' %}selected{% endif %}>🤝 Konsultant</option>
                        <option value="project_member" {% if ptype == 'project_member' %}selected{% endif %}>📋 Loyiha ishtirokchisi</option>
                    </select>
                </div>

                <div class="form-group" id="field-staff-rate-edit" {% if ptype not in ('staff', '') %}style="display:none;"{% endif %}>
                    <label for="staff_rate">Shtat birligi</label>
                    <select id="staff_rate" name="staff_rate">
                        {% set current_rate = user_info.staff_rate|default(1.0)|float %}
                        <option value="0"    {% if current_rate == 0 %}selected{% endif %}>0 (Faqat o'qiydi)</option>
                        <option value="0.25" {% if current_rate == 0.25 %}selected{% endif %}>0.25</option>
                        <option value="0.5"  {% if current_rate == 0.5 %}selected{% endif %}>0.5</option>
                        <option value="0.75" {% if current_rate == 0.75 %}selected{% endif %}>0.75</option>
                        <option value="1.0"  {% if current_rate == 1.0 %}selected{% endif %}>1.0</option>
                        <option value="1.25" {% if current_rate == 1.25 %}selected{% endif %}>1.25</option>
                        <option value="1.5"  {% if current_rate == 1.5 %}selected{% endif %}>1.5</option>
                        <option value="1.75" {% if current_rate == 1.75 %}selected{% endif %}>1.75</option>
                        <option value="2.0"  {% if current_rate == 2.0 %}selected{% endif %}>2.0</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Qo'shimcha ma'lumot</label>
                    <input type="text" id="notes" name="notes" value="{{ user_info.notes or '' }}"
                        placeholder="Kelish maqsadi / Shartnoma / Loyiha nomi / Kurs va rahbar">
                    <small style="color:var(--text-light);">Kategoriyaga qarab: kurs, maqsad, loyiha nomi va h.k.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 O'zgarishlarni saqlash</button>
                    <a href="/users/{{ name }}" class="btn btn-secondary">Bekor qilish</a>
                </div>
            </form>

            <div id="status" class="status-message" style="display: none;"></div>
        </div>
    </div>
</div>

<div class="mt-6">
    <a href="/users" class="back-link">← Xodimlar ro'yxatiga qaytish</a>
</div>

<style>
    .edit-container {
        max-width: 560px;
        margin: 0 auto;
    }

    .form-actions {
        display: flex;
        gap: 16px;
        margin-top: 28px;
    }

    .locked-input {
        background: var(--bg-primary) !important;
        color: var(--text-light) !important;
        cursor: not-allowed;
    }
</style>

<script>
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('status');
        const btn = document.querySelector('.btn-primary');

        btn.textContent = 'Saving...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/users/{{ name }}/update', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            statusDiv.style.display = 'block';

            if (response.ok) {
                statusDiv.textContent = "✅ " + result.message;
                statusDiv.className = "status-message success";
                setTimeout(() => window.location.href = '/users/{{ name }}', 1500);
            } else {
                statusDiv.textContent = "❌ Error: " + result.message;
                statusDiv.className = "status-message error";
            }
        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = "❌ Network Error: " + err;
            statusDiv.className = "status-message error";
        }

        btn.textContent = '💾 Save Changes';
        btn.disabled = false;
    });
</script>
{% endblock %}
