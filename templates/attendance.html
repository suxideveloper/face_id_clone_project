{% extends "base.html" %}

{% block content %}
<div class="users-container">
    <h1>Attendance Dashboard</h1>

    <div class="filters-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name or ID...">
        </div>
        <div class="filter-box">
            <select id="deptFilter">
                <option value="">All Departments</option>
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Operations">Operations</option>
                <option value="Security">Security</option>
                <option value="Management">Management</option>
            </select>
        </div>
        <div class="date-filter">
            <input type="date" id="startDateFilter" title="Start Date">
            <span>to</span>
            <input type="date" id="endDateFilter" title="End Date">
        </div>
        <button id="resetFilters" class="btn">Reset</button>
    </div>

    <div class="users-grid-container" style="display: block;">
        <div style="overflow-x: auto;">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Employee</th>
                        <th>Department</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Hours</th>
                        <th>Snapshots</th>
                        <th style="width: 50px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Snapshot Modal -->
<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImage">
    <div id="caption"></div>
</div>

<style>
    /* ... existing styles ... */
    .users-container {
        padding: 20px;
    }

    .users-table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid #eee;
    }

    .users-table th,
    .users-table td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;
    }

    .users-table th {
        background-color: #f1fafe;
        color: #0277bd;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    .users-table tr:hover {
        background-color: #fafafa;
    }

    .filters-container {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        border: 1px solid #eee;
    }

    .search-box input,
    .filter-box select,
    .date-filter input {
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px solid #ddd;
        background: #fff;
        color: #333;
        font-size: 0.95rem;
        transition: border-color 0.3s;
    }

    .search-box input:focus,
    .filter-box select:focus,
    .date-filter input:focus {
        border-color: #29b6f6;
        outline: none;
    }

    .search-box {
        flex: 2;
    }

    .filter-box {
        flex: 1;
    }

    .date-filter {
        flex: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #666;
    }

    .employee-cell {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .snapshot-preview {
        height: 45px;
        width: auto;
        border-radius: 4px;
        border: 1px solid #ddd;
        cursor: pointer;
        transition: transform 0.2s;
        background: #f5f5f5;
    }

    .snapshot-preview:hover {
        transform: scale(1.1);
        border-color: #0288d1;
    }

    .btn-delete {
        background: #ffebee;
        color: #c62828;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1.2rem;
        transition: background 0.2s;
    }

    .btn-delete:hover {
        background: #ffcdd2;
    }

    .deleted-badge {
        font-size: 0.7rem;
        background: #eee;
        color: #666;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 6px;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        padding-top: 50px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.85);
    }

    .modal-content {
        margin: auto;
        display: block;
        width: 80%;
        max-width: 800px;
        border-radius: 8px;
        animation: zoom 0.3s;
    }

    @keyframes zoom {
        from {
            transform: scale(0)
        }

        to {
            transform: scale(1)
        }
    }

    .close-modal {
        position: absolute;
        top: 15px;
        right: 35px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        transition: 0.3s;
        cursor: pointer;
    }

    .close-modal:hover,
    .close-modal:focus {
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
    }
</style>

<script>
    let allRecords = [];

    async function loadAttendance() {
        const startDate = document.getElementById('startDateFilter').value;
        const endDate = document.getElementById('endDateFilter').value;
        let url = '/api/attendance/all';
        const params = new URLSearchParams();
        if (startDate) params.append('start_date', startDate);
        if (endDate) params.append('end_date', endDate);
        if (params.toString()) url += '?' + params.toString();

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data');
            allRecords = await response.json();
            renderTable();
        } catch (error) {
            console.error('Error loading attendance:', error);
            document.getElementById('attendanceTableBody').innerHTML =
                '<tr><td colspan="8" style="text-align:center; padding:20px; color:red;">Error loading data.</td></tr>';
        }
    }

    async function deleteRecord(dateStr, workerId) {
        if (!confirm(`Are you sure you want to delete this record for ${workerId}? This cannot be undone.`)) return;

        try {
            const response = await fetch(`/api/attendance/${dateStr}/${workerId}`, { method: 'DELETE' });
            if (response.ok) {
                // Remove locally and re-render
                allRecords = allRecords.filter(r => !(r.date === dateStr && r.worker_id === workerId));
                renderTable();
            } else {
                alert("Failed to delete record");
            }
        } catch (e) {
            console.error(e);
            alert("Error deleting record");
        }
    }

    function openModal(src) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        modal.style.display = "block";
        modalImg.src = src;
    }

    function renderTable() {
        const tbody = document.getElementById('attendanceTableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const deptFilter = document.getElementById('deptFilter').value;

        tbody.innerHTML = '';

        const filtered = allRecords.filter(record => {
            const fullName = (record.full_name || "").toLowerCase();
            const workerId = (record.worker_id || "").toLowerCase();
            const matchSearch = fullName.includes(searchTerm) || workerId.includes(searchTerm);
            const matchDept = !deptFilter || (record.department === deptFilter);
            return matchSearch && matchDept;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px; color: #888;">No records found</td></tr>';
            return;
        }

        filtered.forEach(record => {
            const getSnapshotUrl = (path) => {
                if (!path) return null;
                const filename = path.split('/').pop();
                return `/snapshots/${filename}`;
            };

            const checkInImg = getSnapshotUrl(record.check_in_snapshot);
            const checkOutImg = getSnapshotUrl(record.check_out_snapshot);

            const formatTime = (isoStr) => {
                if (!isoStr) return "-";
                try { return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); } catch (e) { return isoStr; }
            };

            // Delete only for unknown/deleted users
            const deleteAction = (!record.is_known) ?
                `<button class="btn-delete" onclick="deleteRecord('${record.date}', '${record.worker_id}')" title="Delete Record">🗑️</button>` :
                `<span style="color:#ccc" title="Cannot delete active users">🔒</span>`;

            const userStatus = '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500; color: #555;">${record.date}</td>
                <td>
                    <div class="employee-cell">
                        <div class="employee-info">
                            <div style="font-weight:bold;">${record.full_name || record.worker_id} ${userStatus}</div>
                            ${record.full_name ? `<div style="font-size:0.8em; color:#888;">ID: ${record.worker_id}</div>` : ''}
                        </div>
                    </div>
                </td>
                <td><span class="badge ${record.department}">${record.department || 'General'}</span></td>
                <td style="color: #2e7d32; font-weight: 500;">${formatTime(record.check_in_time)}</td>
                <td style="color: #0277bd; font-weight: 500;">${formatTime(record.check_out_time)}</td>
                <td style="font-weight: 600;">${record.working_hours || '-'}</td>
                <td>
                    <div style="display: flex; gap: 10px;">
                        ${checkInImg ? `<img src="${checkInImg}" class="snapshot-preview" onclick="openModal('${checkInImg}')" title="Check-in">` : '<span style="color:#ccc">-</span>'}
                        ${checkOutImg ? `<img src="${checkOutImg}" class="snapshot-preview" onclick="openModal('${checkOutImg}')" title="Check-out" style="border-color: #0277bd;">` : ''}
                    </div>
                </td>
                <td style="text-align: center;">${deleteAction}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Modal Events
    document.querySelector('.close-modal').onclick = () => { document.getElementById("imageModal").style.display = "none"; };
    window.onclick = (event) => {
        if (event.target == document.getElementById("imageModal")) {
            document.getElementById("imageModal").style.display = "none";
        }
    };

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderTable);
    document.getElementById('deptFilter').addEventListener('change', renderTable);
    document.getElementById('startDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('endDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('resetFilters').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        loadAttendance();
    });

    // Initial load
    loadAttendance();
</script>
{% endblock %}
