{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Kelgan va ketgan vaqtlar</h1>
</div>

<div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Ism yoki ID bo'yicha qidirish..."
        style="flex: 2; min-width: 200px;">
    <select id="deptFilter" style="min-width: 150px;">
        <option value="">Barcha bo'limlar</option>
        {% for dept in departments %}
        <option value="{{ dept.name }}">{{ dept.name }}</option>
        {% endfor %}
    </select>
    <input type="date" id="startDateFilter" title="Start Date">
    <span style="color: var(--text-light);">dan</span>
    <input type="date" id="endDateFilter" title="End Date">

    <button id="resetFilters" class="btn btn-secondary">Tozalash</button>
    <button type="button" id="btn15Days" class="btn btn-secondary" title="Oxirgi 15 kun">15 Kun</button>
    <button type="button" id="btn1Month" class="btn btn-secondary" title="Oxirgi 1 oy">1 Oy</button>
    <button type="button" id="exportExcelBtn" class="btn btn-primary" title="Joriy sana filtrlari bo'yicha Excel" style="margin-left: auto;">📥 Excel yuklash</button>
</div>

<div class="table-container">
    <table class="modern-table">
        <thead>
            <tr>
                <th>Sana</th>
                <th>Xodim</th>
                <th>Bo'lim</th>
                <th>Kelgan vaqt</th>
                <th>Ketgan vaqt</th>
                <th>Sof ish vaqti</th>
                <th>Holat</th>
                <th>Rasmlar</th>
                <th style="width: 60px;">Actions</th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Rows populated by JS -->
        </tbody>
    </table>
</div>

<!-- Pagination -->
<div id="paginationContainer" style="display:flex; justify-content:center; align-items:center; gap:8px; margin-top:18px; flex-wrap:wrap;">
</div>

<!-- Snapshot Modal -->
<div id="imageModal" class="image-modal">
    <span class="close-modal">&times;</span>
    <img class="modal-img" id="modalImage">
</div>

<style>
    .snapshot-preview {
        height: 42px;
        width: auto;
        border-radius: 6px;
        border: 2px solid var(--border-color);
        cursor: pointer;
        transition: all 0.2s;
        background: var(--bg-primary);
    }

    .snapshot-preview:hover {
        border-color: var(--accent-green);
    }

    .snapshot-preview.checkout {
        border-color: var(--accent-blue);
    }

    .image-modal {
        display: none;
        position: fixed;
        z-index: 3000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        /* Flexbox for perfect centering */
        justify-content: center;
        align-items: center;
    }

    .modal-img {
        margin: auto;
        display: block;
        width: 80%;
        max-width: 800px;
        border-radius: 12px;
        animation: zoomIn 0.3s;
    }

    @keyframes zoomIn {
        from {
            transform: scale(0.8);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .close-modal {
        position: absolute;
        top: 20px;
        right: 40px;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }

    .close-modal:hover {
        color: var(--accent-red);
    }

    .time-in {
        color: var(--accent-green);
        font-weight: 600;
    }

    .time-out {
        color: var(--accent-blue);
        font-weight: 600;
    }

    .hours-worked {
        font-weight: 700;
        color: var(--text-dark);
    }

    .user-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .user-link:hover {
        text-decoration: underline;
    }

    /* Badge Rate */
    .badge-rate {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    /* Pagination */
    .pagination-btn {
        min-width: 38px;
        height: 38px;
        border: 1px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-dark);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
    }
    .pagination-btn:hover {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
    }
    .pagination-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .pagination-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .pagination-info {
        font-size: 0.85rem;
        color: var(--text-light);
        margin: 0 8px;
    }
</style>

<script>
    let allRecords = [];
    let currentPage = 1;
    const RECORDS_PER_PAGE = 15;

    async function loadAttendance() {
        const startDate = document.getElementById('startDateFilter').value;
        const endDate = document.getElementById('endDateFilter').value;
        let url = '/api/attendance/all';
        const params = new URLSearchParams();
        if (startDate) params.append('start_date', startDate);
        if (endDate) params.append('end_date', endDate);
        if (params.toString()) url += '?' + params.toString();

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data');
            allRecords = await response.json();
            currentPage = 1;
            renderTable();
        } catch (error) {
            console.error('Error loading attendance:', error);
            document.getElementById('attendanceTableBody').innerHTML =
                '<tr><td colspan="9" class="text-center" style="padding:30px; color:var(--accent-red);">Error loading data.</td></tr>';
        }
    }

    async function deleteRecord(dateStr, workerId) {
        if (!confirm(`Delete record for ${workerId}? This cannot be undone.`)) return;

        try {
            const response = await fetch(`/api/attendance/${dateStr}/${workerId}`, { method: 'DELETE' });
            if (response.ok) {
                allRecords = allRecords.filter(r => !(r.date === dateStr && r.worker_id === workerId));
                renderTable();
            } else {
                alert("Failed to delete record");
            }
        } catch (e) {
            console.error(e);
            alert("Error deleting record");
        }
    }

    function openModal(src) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        modal.style.display = "flex";
        modalImg.src = src;
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
        // Scroll to top of table
        document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderPagination(totalItems) {
        const container = document.getElementById('paginationContainer');
        const totalPages = Math.ceil(totalItems / RECORDS_PER_PAGE);
        container.innerHTML = '';

        if (totalPages <= 1) return;

        // Prev button
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pagination-btn';
        prevBtn.innerHTML = '‹';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => goToPage(currentPage - 1);
        container.appendChild(prevBtn);

        // Page buttons
        const maxVisible = 5;
        let startP = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endP = Math.min(totalPages, startP + maxVisible - 1);
        if (endP - startP < maxVisible - 1) startP = Math.max(1, endP - maxVisible + 1);

        if (startP > 1) {
            const b = document.createElement('button');
            b.className = 'pagination-btn';
            b.textContent = '1';
            b.onclick = () => goToPage(1);
            container.appendChild(b);
            if (startP > 2) {
                const dots = document.createElement('span');
                dots.className = 'pagination-info';
                dots.textContent = '...';
                container.appendChild(dots);
            }
        }

        for (let i = startP; i <= endP; i++) {
            const b = document.createElement('button');
            b.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
            b.textContent = i;
            b.onclick = () => goToPage(i);
            container.appendChild(b);
        }

        if (endP < totalPages) {
            if (endP < totalPages - 1) {
                const dots = document.createElement('span');
                dots.className = 'pagination-info';
                dots.textContent = '...';
                container.appendChild(dots);
            }
            const b = document.createElement('button');
            b.className = 'pagination-btn';
            b.textContent = totalPages;
            b.onclick = () => goToPage(totalPages);
            container.appendChild(b);
        }

        // Next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pagination-btn';
        nextBtn.innerHTML = '›';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => goToPage(currentPage + 1);
        container.appendChild(nextBtn);

        // Info text
        const info = document.createElement('span');
        info.className = 'pagination-info';
        const from = (currentPage - 1) * RECORDS_PER_PAGE + 1;
        const to = Math.min(currentPage * RECORDS_PER_PAGE, totalItems);
        info.textContent = `${from}-${to} / ${totalItems}`;
        container.appendChild(info);
    }

    function renderTable() {
        const tbody = document.getElementById('attendanceTableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const deptFilter = document.getElementById('deptFilter').value;

        tbody.innerHTML = '';

        const filtered = allRecords.filter(record => {
            const fullName = (record.full_name || "").toLowerCase();
            const workerId = (record.worker_id || "").toLowerCase();
            const matchSearch = fullName.includes(searchTerm) || workerId.includes(searchTerm);
            const matchDept = !deptFilter || (record.department === deptFilter);
            return matchSearch && matchDept;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center" style="padding: 40px; color: var(--text-light);">No records found</td></tr>';
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }

        // Pagination slice
        const totalPages = Math.ceil(filtered.length / RECORDS_PER_PAGE);
        if (currentPage > totalPages) currentPage = totalPages;
        const startIdx = (currentPage - 1) * RECORDS_PER_PAGE;
        const pageRecords = filtered.slice(startIdx, startIdx + RECORDS_PER_PAGE);

        pageRecords.forEach(record => {
            const getSnapshotUrl = (path) => {
                if (!path) return null;
                const filename = path.split('/').pop();
                return `/snapshots/${filename}`;
            };

            const checkInImg = getSnapshotUrl(record.check_in_snapshot);
            const checkOutImg = getSnapshotUrl(record.check_out_snapshot);

            const formatTime = (isoStr) => {
                if (!isoStr) return "-";
                try { return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
                catch (e) { return isoStr; }
            };

            const deleteAction =
                `<button class="btn-action btn-delete" onclick="deleteRecord('${record.date}', '${record.worker_id}')" title="Delete">🗑️</button>`;

            const getStaffBadge = () => {
                if (record.is_doctorant) return '<span class="badge-rate" style="background: rgba(139, 92, 246, 0.15); color: #7c3aed; font-size: 0.75rem;">🎓 Doc</span>';
                if (record.staff_rate) {
                    if (record.staff_rate < 1.0) return `<span class="badge-rate" style="background: rgba(245, 158, 11, 0.15); color: #d97706; font-size: 0.75rem;">${record.staff_rate}</span>`;
                    return `<span class="badge-rate" style="background: rgba(34, 197, 94, 0.15); color: #16a34a; font-size: 0.75rem;">${record.staff_rate}</span>`;
                }
                return '';
            };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500; white-space: nowrap;">${record.date}</td>
                <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div>
                            <a href="/users/${record.worker_id}" class="user-link">${record.full_name || record.worker_id}</a>
                            ${record.full_name ? `<div style="font-size: 0.8rem; color: var(--text-light);">ID: ${record.worker_id}</div>` : ''}
                        </div>
                        ${getStaffBadge()}
                    </div>
                </td>
                <td><span class="badge ${record.department}">${record.department || 'General'}</span></td>
                <td class="time-in" style="white-space: nowrap;">${formatTime(record.check_in_time)}</td>
                <td class="time-out" style="white-space: nowrap;">${formatTime(record.check_out_time)}</td>
                <td class="hours-worked">
                    ${record.net_hours || record.working_hours || '-'}
                    ${record.abet_applied ? '<div style="font-size: 0.75rem; color: var(--accent-red); margin-top: 2px;">-1s Abet</div>' : ''}
                </td>
                <td style="font-size: 0.9rem; color: var(--text-medium);">${record.status_label || '—'}</td>
                <td>
                    <div style="display: flex; gap: 8px;">
                        ${checkInImg ? `<img src="${checkInImg}" class="snapshot-preview" onclick="openModal('${checkInImg}')" title="Check-in">` : '<span style="color:var(--text-light)">-</span>'}
                        ${checkOutImg ? `<img src="${checkOutImg}" class="snapshot-preview checkout" onclick="openModal('${checkOutImg}')" title="Check-out">` : ''}
                    </div>
                </td>
                <td style="text-align: center;">${deleteAction}</td>
            `;
            tbody.appendChild(tr);
        });

        renderPagination(filtered.length);
    }

    // Modal Events
    document.querySelector('.close-modal').onclick = () => { document.getElementById("imageModal").style.display = "none"; };
    window.onclick = (event) => {
        if (event.target == document.getElementById("imageModal")) {
            document.getElementById("imageModal").style.display = "none";
        }
    };

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderTable(); });
    document.getElementById('deptFilter').addEventListener('change', () => { currentPage = 1; renderTable(); });
    document.getElementById('startDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('endDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('resetFilters').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        loadAttendance();
    });

    function toISODate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    document.getElementById('btn15Days').addEventListener('click', () => {
        const today = new Date();
        const start = new Date(today.getFullYear(), today.getMonth(), 1);
        
        let end = new Date(today);
        if (today.getDate() > 15) {
            end = new Date(today.getFullYear(), today.getMonth(), 15);
        }
        
        document.getElementById('startDateFilter').value = toISODate(start);
        document.getElementById('endDateFilter').value = toISODate(end);
        loadAttendance();
    });

    document.getElementById('btn1Month').addEventListener('click', () => {
        const today = new Date();
        const start = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(today);
        
        document.getElementById('startDateFilter').value = toISODate(start);
        document.getElementById('endDateFilter').value = toISODate(end);
        loadAttendance();
    });


    document.getElementById('exportExcelBtn').addEventListener('click', () => {
        const startDate = document.getElementById('startDateFilter').value;
        const endDate = document.getElementById('endDateFilter').value;
        let url = '/api/attendance/export/excel';
        const params = new URLSearchParams();
        if (startDate) params.append('start_date', startDate);
        if (endDate) params.append('end_date', endDate);
        if (params.toString()) url += '?' + params.toString();
        window.location.href = url;
    });

    // Initial load
    loadAttendance();
</script>
{% endblock %}
