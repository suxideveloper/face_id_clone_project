{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Kelgan va ketgan vaqtlar</h1>
</div>

<div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Ism yoki ID bo'yicha qidirish..."
        style="flex: 2; min-width: 200px;">
    <select id="deptFilter" style="min-width: 150px;">
        <option value="">Barcha bo'limlar</option>
        <option value="Rahbariyat">Rahbariyat</option>
        <option value="Buxgalteriya">Buxgalteriya</option>
        <option value="HR">Xodimlar bilan ishlash bo'limi</option>
        <option value="mutaxassislar">Mutaxassislar</option>
        <option value="biometrik tizimlar labaratoriyasi">Biometrik tizimlar labaratoriyasi</option>
        <option value="Intelektual dastury tizimlar qo'shma labaratoriyasi">Intelektual dastury tizimlar qo'shma
            labaratoriyasi</option>
        <option value="Timsollarni tanib olish labaratoriyasi">Timsollarni tanib olish labaratoriyasi</option>
        <option value="tabiy tilni qayta ishlash labaratoriyasi">Tabiiy tilni qayta ishlash labaratoriyasi</option>
        <option value="Murakkab tizimlarni modellashtirish labaratoriyasi">Murakkab tizimlarni modellashtirish
            labaratoriyasi</option>
        <option value="Sun'iy intelekt va mashinaviy o'qitish labaratoriyasi">Sun'iy intelekt va mashinaviy o'qitish
            labaratoriyasi</option>
        <option value="Aqilli tizimlar va buyumlar interneti labaratoriyasi">Aqilli tizimlar va buyumlar interneti
            labaratoriyasi</option>
        <option value="Texnik tizimlarni boshqarish va raqamli loyhalash labaratoriyasi">Texnik tizimlarni
            boshqarish va raqamli loyhalash labaratoriyasi</option>
        <option value="Dasturiy mahsulotlarni ishlab chiqsh bo'limi">Dasturiy mahsulotlarni ishlab chiqsh bo'limi
        </option>
        <option value="Dasturiy mahsulotlarni sinovdan o'tkazish bo'limi">Dasturiy mahsulotlarni sinovdan o'tkazish
            bo'limi</option>
        <option value="Dasturiy mahsulotlarni joriy etish bo'limi">Dasturiy mahsulotlarni joriy etish bo'limi</option>
        <option value="AKT startuplarni qo'llab quvvatlash bo'limi">AKT startuplarni qo'llab quvvatlash bo'limi</option>
        <option value="Patentlash va tijoratlashtirish bo'limi">Patentlash va tijoratlashtirish bo'limi</option>
        <option value="Umumiy bo'lim">Umumiy bo'lim</option>
    </select>
    <input type="date" id="startDateFilter" title="Start Date">
    <span style="color: var(--text-light);">dan</span>
    <input type="date" id="endDateFilter" title="End Date">
    <button id="resetFilters" class="btn btn-secondary">Tozalash</button>
</div>

<div class="table-container">
    <table class="modern-table">
        <thead>
            <tr>
                <th>Sana</th>
                <th>Xodim</th>
                <th>Bo'lim</th>
                <th>Kelgan vaqt</th>
                <th>Ketgan vaqt</th>
                <th>Ishlangan vaqt</th>
                <th>Rasmlar</th>
                <th style="width: 60px;">Actions</th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Rows populated by JS -->
        </tbody>
    </table>
</div>

<!-- Snapshot Modal -->
<div id="imageModal" class="image-modal">
    <span class="close-modal">&times;</span>
    <img class="modal-img" id="modalImage">
</div>

<style>
    .snapshot-preview {
        height: 42px;
        width: auto;
        border-radius: 6px;
        border: 2px solid var(--border-color);
        cursor: pointer;
        transition: all 0.2s;
        background: var(--bg-primary);
    }

    .snapshot-preview:hover {
        border-color: var(--accent-green);
    }

    .snapshot-preview.checkout {
        border-color: var(--accent-blue);
    }

    .image-modal {
        display: none;
        position: fixed;
        z-index: 3000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        /* Flexbox for perfect centering */
        justify-content: center;
        align-items: center;
    }

    .modal-img {
        margin: auto;
        display: block;
        width: 80%;
        max-width: 800px;
        border-radius: 12px;
        animation: zoomIn 0.3s;
    }

    @keyframes zoomIn {
        from {
            transform: scale(0.8);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .close-modal {
        position: absolute;
        top: 20px;
        right: 40px;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }

    .close-modal:hover {
        color: var(--accent-red);
    }

    .time-in {
        color: var(--accent-green);
        font-weight: 600;
    }

    .time-out {
        color: var(--accent-blue);
        font-weight: 600;
    }

    .hours-worked {
        font-weight: 700;
        color: var(--text-dark);
    }
</style>

<script>
    let allRecords = [];

    async function loadAttendance() {
        const startDate = document.getElementById('startDateFilter').value;
        const endDate = document.getElementById('endDateFilter').value;
        let url = '/api/attendance/all';
        const params = new URLSearchParams();
        if (startDate) params.append('start_date', startDate);
        if (endDate) params.append('end_date', endDate);
        if (params.toString()) url += '?' + params.toString();

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch data');
            allRecords = await response.json();
            renderTable();
        } catch (error) {
            console.error('Error loading attendance:', error);
            document.getElementById('attendanceTableBody').innerHTML =
                '<tr><td colspan="8" class="text-center" style="padding:30px; color:var(--accent-red);">Error loading data.</td></tr>';
        }
    }

    async function deleteRecord(dateStr, workerId) {
        if (!confirm(`Delete record for ${workerId}? This cannot be undone.`)) return;

        try {
            const response = await fetch(`/api/attendance/${dateStr}/${workerId}`, { method: 'DELETE' });
            if (response.ok) {
                allRecords = allRecords.filter(r => !(r.date === dateStr && r.worker_id === workerId));
                renderTable();
            } else {
                alert("Failed to delete record");
            }
        } catch (e) {
            console.error(e);
            alert("Error deleting record");
        }
    }

    function openModal(src) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        modal.style.display = "flex";
        modalImg.src = src;
    }

    function renderTable() {
        const tbody = document.getElementById('attendanceTableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const deptFilter = document.getElementById('deptFilter').value;

        tbody.innerHTML = '';

        const filtered = allRecords.filter(record => {
            const fullName = (record.full_name || "").toLowerCase();
            const workerId = (record.worker_id || "").toLowerCase();
            const matchSearch = fullName.includes(searchTerm) || workerId.includes(searchTerm);
            const matchDept = !deptFilter || (record.department === deptFilter);
            return matchSearch && matchDept;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center" style="padding: 40px; color: var(--text-light);">No records found</td></tr>';
            return;
        }

        filtered.forEach(record => {
            const getSnapshotUrl = (path) => {
                if (!path) return null;
                const filename = path.split('/').pop();
                return `/snapshots/${filename}`;
            };

            const checkInImg = getSnapshotUrl(record.check_in_snapshot);
            const checkOutImg = getSnapshotUrl(record.check_out_snapshot);

            const formatTime = (isoStr) => {
                if (!isoStr) return "-";
                try { return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
                catch (e) { return isoStr; }
            };

            const deleteAction = (!record.is_known) ?
                `<button class="btn-action btn-delete" onclick="deleteRecord('${record.date}', '${record.worker_id}')" title="Delete">🗑️</button>` :
                `<span style="color:var(--text-light)" title="Cannot delete active users">🔒</span>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500;">${record.date}</td>
                <td>
                    <div>
                        <div style="font-weight: 600;">${record.full_name || record.worker_id}</div>
                        ${record.full_name ? `<div style="font-size: 0.8rem; color: var(--text-light);">ID: ${record.worker_id}</div>` : ''}
                    </div>
                </td>
                <td><span class="badge ${record.department}">${record.department || 'General'}</span></td>
                <td class="time-in">${formatTime(record.check_in_time)}</td>
                <td class="time-out">${formatTime(record.check_out_time)}</td>
                <td class="hours-worked">${record.working_hours || '-'}</td>
                <td>
                    <div style="display: flex; gap: 8px;">
                        ${checkInImg ? `<img src="${checkInImg}" class="snapshot-preview" onclick="openModal('${checkInImg}')" title="Check-in">` : '<span style="color:var(--text-light)">-</span>'}
                        ${checkOutImg ? `<img src="${checkOutImg}" class="snapshot-preview checkout" onclick="openModal('${checkOutImg}')" title="Check-out">` : ''}
                    </div>
                </td>
                <td style="text-align: center;">${deleteAction}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Modal Events
    document.querySelector('.close-modal').onclick = () => { document.getElementById("imageModal").style.display = "none"; };
    window.onclick = (event) => {
        if (event.target == document.getElementById("imageModal")) {
            document.getElementById("imageModal").style.display = "none";
        }
    };

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderTable);
    document.getElementById('deptFilter').addEventListener('change', renderTable);
    document.getElementById('startDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('endDateFilter').addEventListener('change', loadAttendance);
    document.getElementById('resetFilters').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('deptFilter').value = '';
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        loadAttendance();
    });

    // Initial load
    loadAttendance();
</script>
{% endblock %}
