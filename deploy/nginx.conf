# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream face_id_app {
    server 127.0.0.1:8080;
}

# HTTP dan HTTPS ga yo'naltirish
server {
    listen 80;
    server_name faceid.airi.uz;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name faceid.airi.uz;

    # SSL sertifikatlar (Certbot buni avtomatik to'ldiradi, pastga qarang)
    # ssl_certificate /etc/letsencrypt/live/faceid.airi.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/faceid.airi.uz/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /home/suxrob/Documents/face_id/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        alias /home/suxrob/Documents/face_id/data/images/;
        expires 7d;
        access_log off;
    }

    location /snapshots/ {
        alias /home/suxrob/Documents/face_id/data/attendance_snapshots/;
        expires 1d;
        access_log off;
    }

    # Video feed (MJPEG)
    location /video_feed {
        proxy_pass http://face_id_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://face_id_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API va asosiy ilova
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://face_id_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://face_id_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}