# =============================================================================
# Nginx Configuration for Face ID (Employee Attendance System)
# Server: 10.10.0.129
#
# Installation:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/face_id
#   sudo ln -sf /etc/nginx/sites-available/face_id /etc/nginx/sites-enabled/face_id
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
# =============================================================================

# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# --- Upstream ---
upstream face_id_app {
    server 127.0.0.1:8080;
}

# =============================================
# HTTP Server (port 80)
# =============================================
server {
    listen 80;
    server_name 10.10.0.129;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for face registration images)
    client_max_body_size 10M;

    # --- Static files (served directly by Nginx — faster) ---
    location /static/ {
        alias /home/suxrob/Documents/face_id/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        alias /home/suxrob/Documents/face_id/data/images/;
        expires 7d;
        access_log off;
    }

    location /snapshots/ {
        alias /home/suxrob/Documents/face_id/data/attendance_snapshots/;
        expires 1d;
        access_log off;
    }

    # --- Video feed (MJPEG stream — special config) ---
    location /video_feed {
        proxy_pass http://face_id_app;
        proxy_buffering off;         # CRITICAL: disable buffering for MJPEG stream
        proxy_cache off;
        proxy_read_timeout 300s;     # Keep stream alive
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket endpoint ---
    location /ws {
        proxy_pass http://face_id_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;    # 24 hours — keep WS alive
    }

    # --- All other requests → FastAPI ---
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://face_id_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- API rate limiting ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://face_id_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


